# Ajustes operativos de primecracker (ver settings.py).
# Todo es opcional: lo que falte toma el valor por defecto. Una clave
# desconocida hace fallar el arranque, para que una errata no pase
# desapercibida.

# Binarios (ecm_bin, yafu_bin, cado-nfs/)
# toolchain_dir = "bin/active"

# Hilos. 0 = automático según los núcleos del equipo: el ancla (YAFU/GNFS)
# usa todos (la mitad si ecm_parallel = true).
# total_threads = 0
# anchor_threads = 0
# ecm_min_threads = 0           # solo con ecm_parallel

# Pretest de ECM antes de GNFS (factores de hasta ~30 dígitos en segundos)
# ecm_pretest_b1 = 250000
# ecm_pretest_curves = 450
# ecm_pretest_seconds = 120     # 0 = sin pretest

# Modos antiguos (ver settings.py)
# ecm_parallel = false          # ECM junto al ancla todo el ataque, con AIMD
# enemy_kill_switch = false     # abortar GNFS si el rival supera d_safe_bits

# Límites del controlador
# ram_critical_pct = 90.0
# temp_critical_c = 85.0
# cpu_headroom_pct = 85.0
# d_safe_bits = 330

# Elección de método y reparto del tiempo
# gnfs_min_digits = 93          # desde aquí GNFS en vez de YAFU (cruce medido)
# total_minutes = 60            # sin --minutes ni time_remaining_seconds en state.json
# default_target_seconds = 180  # si no hay predicción del benchmark para el método
