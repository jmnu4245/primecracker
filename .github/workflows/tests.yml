name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # La versión con la que está probado el proyecto (requirements.txt).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Sin los binarios de bin/ (no versionados): los tests de integración
      # se saltarían igualmente; se excluyen para que el informe sea claro.
      - run: pytest -q -m "not integration"
